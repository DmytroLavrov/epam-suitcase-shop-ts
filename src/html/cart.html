<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEST SHOP | Cart</title>
    <link rel="stylesheet" href="../../dist/css/main.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header"></header>
      <main class="main">
        <section class="cart">
          <div class="cart__header-image">
            <h1 class="cart__title title title--hero-header">My Cart</h1>
          </div>
          <div class="cart__container container">
            <div class="cart__content" id="cartContent"></div>
          </div>
        </section>
      </main>
      <footer class="footer"></footer>
      <div class="thank-you-modal modal" id="thankYouModal">
        <div class="thank-you-modal__content">
          <div class="thank-you-modal__icon"></div>
          <div class="thank-you-modal__header-block header-block">
            <h2 class="header-block__title">Thank You for Your Purchase!</h2>
            <p class="header-block__subtitle">
              Your order has been successfully processed. We'll send you a
              confirmation email shortly.
            </p>
          </div>
          <p class="thank-you-modal__decorative-text">
            We appreciate your business! ✨
          </p>
        </div>
      </div>
    </div>
    <script src="../../dist/js/main.js"></script>
    <script src="../../dist/js/cart.js"></script>
  </body>
</html>
